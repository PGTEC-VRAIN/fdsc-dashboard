# Publica la imagen del fork en ghcr.io/pgtec-vrain/fdsc-dashboard.
#
#   git tag v0.7.0 && git push origin v0.7.0
#     -> tests, y la imagen :0.7.0, :0.7, :latest (no en pre-releases) y :sha-<commit>
#
# La imagen es la misma para cualquier proveedor: todo se configura por variables
# de entorno en el despliegue (PROVIDER_DID, TIL_API_URL, TMF_API_URL, ...).
name: Publish image (ghcr)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency: publish-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run generate:api
      - run: npx vue-tsc --noEmit
      - run: npm test
      - run: cd server && npm ci && npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pgtec-vrain/fdsc-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
